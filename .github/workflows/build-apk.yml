name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  NODE_VERSION: 24.15.0

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install npm deps
        run: npm ci

      - name: Install bundler
        run: gem install bundler -v '~> 2.0'

      - name: Bundle install
        run: cd fastlane && bundle install

      - name: Jetify
        run: npx jetify

      - name: Build debug APK
        run: cd fastlane && bundle exec fastlane android build --env android.debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-apk
          path: |
            *.apk
            android/app/build/outputs/apk/**/*.apk
